<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>RakshaConnect — Accident Alert</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Poppins:300,400,500,600,700,800|Oswald:300,400,500,600,700">
  <style>
    /* ----- GLOBAL WEBSITE LAYOUT ----- */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --cream: #F9FCFF;
      --backdrop: #E9ECF1;
      --paper: #FFFFFF;
      --teal: #1B2032;
      --teal-deep: #12151F;
      --teal-soft: #E7E8ED;
      --brick: #F5325C;
      --brick-soft: #FDE1E8;
      --amber: #FFAA17;
      --amber-soft: #FFF1D9;
      --ink: #232A34;
      --ink-soft: #747474;
      --line: #E5E5E8;
      --font-body: 'Poppins', sans-serif;
      --font-head: 'Oswald', sans-serif;
      --radius-lg: 22px;
      --radius-md: 16px;
      --radius-sm: 11px;
      --max-width: 1280px;
      --shadow-card: 0 12px 30px -10px rgba(18, 21, 31, 0.12);
    }

    body {
      font-family: var(--font-body);
      background: var(--backdrop);
      color: var(--ink-soft);
      min-height: 100vh;
      padding: 0;
      margin: 0;
      -webkit-tap-highlight-color: transparent;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* ----- WEBSITE WRAPPER (full width) ----- */
    .website-wrapper {
      width: 100%;
      max-width: var(--max-width);
      margin: 0 auto;
      padding: 20px 24px 40px;
      display: flex;
      flex-direction: column;
      gap: 28px;
    }

    /* ----- HEADER (website) ----- */
    .site-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 0 12px;
      border-bottom: 2px solid var(--line);
      flex-wrap: wrap;
      gap: 16px;
    }

    .site-brand {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .site-brand .brand-mark {
      width: 52px;
      height: 52px;
      border-radius: 16px;
      background: linear-gradient(155deg, var(--teal), var(--teal-deep));
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 8px 16px -6px rgba(18, 21, 31, 0.45);
      flex-shrink: 0;
    }

    .site-brand .brand-mark svg {
      width: 28px;
      height: 28px;
    }

    .site-brand h1 {
      font-family: var(--font-head);
      font-size: 26px;
      font-weight: 600;
      letter-spacing: 0.02em;
      text-transform: uppercase;
      color: var(--teal-deep);
      line-height: 1.1;
    }

    .site-brand .tagline {
      font-size: 13px;
      color: var(--ink-soft);
      margin-top: 2px;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    /* user chip in header when logged in */
    .user-chip {
      display: flex;
      align-items: center;
      gap: 10px;
      background: var(--paper);
      padding: 6px 16px 6px 8px;
      border-radius: 999px;
      border: 1.5px solid var(--line);
      box-shadow: var(--shadow-card);
      cursor: default;
    }

    .user-chip .avatar {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      background: var(--teal);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 14px;
      overflow: hidden;
      flex-shrink: 0;
    }

    .user-chip .avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .user-chip .chip-name {
      font-family: var(--font-head);
      font-weight: 500;
      font-size: 15px;
      color: var(--ink);
    }

    .user-chip .chip-sub {
      font-size: 11px;
      color: var(--ink-soft);
    }

    .icon-btn {
      background: var(--teal-soft);
      border: none;
      width: 42px;
      height: 42px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: var(--teal-deep);
      transition: 0.15s;
      flex-shrink: 0;
    }

    .icon-btn:hover {
      background: #d4d6dd;
    }

    /* ----- AUTH SECTION (website style) ----- */
    .auth-section {
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 70vh;
      padding: 20px 0;
    }

    .auth-card {
      background: var(--paper);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-card);
      border: 1.5px solid var(--line);
      padding: 40px 42px 44px;
      width: 100%;
      max-width: 520px;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    .auth-card .brand {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      margin-bottom: 6px;
    }

    .auth-card .brand-mark {
      width: 60px;
      height: 60px;
      border-radius: 20px;
      background: linear-gradient(155deg, var(--teal), var(--teal-deep));
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 10px 22px -8px rgba(18, 21, 31, 0.55);
    }

    .auth-card .brand-mark svg {
      width: 32px;
      height: 32px;
    }

    .auth-card h1 {
      font-family: var(--font-head);
      font-size: 26px;
      font-weight: 600;
      margin: 0;
      letter-spacing: 0.02em;
      text-transform: uppercase;
      color: var(--teal-deep);
    }

    .auth-card .sub {
      margin: 0;
      font-size: 13px;
      color: var(--ink-soft);
      text-align: center;
      line-height: 1.4;
    }

    .segmented {
      display: flex;
      background: var(--teal-soft);
      border-radius: 999px;
      padding: 4px;
      gap: 4px;
    }

    .seg-btn {
      flex: 1;
      border: none;
      background: transparent;
      padding: 12px 0;
      border-radius: 999px;
      font-family: var(--font-head);
      font-weight: 500;
      font-size: 14px;
      letter-spacing: 0.03em;
      text-transform: uppercase;
      color: var(--teal-deep);
      cursor: pointer;
      transition: 0.2s;
    }

    .seg-btn.active {
      background: var(--teal);
      color: #fff;
      box-shadow: 0 6px 14px -6px rgba(18, 21, 31, 0.5);
    }

    .auth-form {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .field label {
      font-size: 12px;
      font-weight: 600;
      color: var(--ink-soft);
    }

    .field input,
    .field select,
    .field textarea {
      border: 1.5px solid var(--line);
      background: var(--paper);
      border-radius: var(--radius-sm);
      padding: 13px 15px;
      font-size: 15px;
      color: var(--ink);
      outline: none;
      transition: 0.15s;
      font-family: inherit;
    }

    .field textarea {
      resize: vertical;
      min-height: 62px;
    }

    .field input:focus,
    .field select:focus,
    .field textarea:focus {
      border-color: var(--teal);
      box-shadow: 0 0 0 3px rgba(27, 32, 50, 0.12);
    }

    .field-row {
      display: flex;
      gap: 14px;
    }

    .field-row .field {
      flex: 1;
    }

    .btn {
      border: none;
      border-radius: var(--radius-sm);
      padding: 14px 18px;
      font-family: var(--font-head);
      font-weight: 500;
      font-size: 15px;
      letter-spacing: 0.03em;
      text-transform: uppercase;
      cursor: pointer;
      transition: 0.15s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .btn:active {
      transform: scale(0.98);
    }

    .btn-primary {
      background: var(--teal);
      color: #fff;
      box-shadow: 0 8px 18px -8px rgba(18, 21, 31, 0.55);
    }

    .btn-danger {
      background: var(--brick);
      color: #fff;
      box-shadow: 0 8px 18px -8px rgba(245, 50, 92, 0.45);
    }

    .btn-amber {
      background: var(--amber);
      color: var(--teal-deep);
      box-shadow: 0 8px 18px -8px rgba(255, 170, 23, 0.5);
    }

    .btn-ghost {
      background: transparent;
      color: var(--teal-deep);
      border: 1.5px solid var(--line);
    }

    .btn-block {
      width: 100%;
    }

    .link-btn {
      background: none;
      border: none;
      color: var(--amber);
      font-family: var(--font-head);
      font-weight: 500;
      font-size: 13px;
      cursor: pointer;
      padding: 2px;
      text-align: center;
      text-decoration: underline;
      text-underline-offset: 3px;
      letter-spacing: 0.01em;
    }

    /* ----- MODALS (website adapted) ----- */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(18, 21, 31, 0.55);
      backdrop-filter: blur(3px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 50;
      padding: 24px;
    }

    .modal-card {
      background: var(--paper);
      width: 100%;
      max-width: 460px;
      border-radius: 24px;
      padding: 28px 28px 32px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      max-height: 85vh;
      overflow-y: auto;
      box-shadow: 0 30px 60px -20px rgba(0, 0, 0, 0.3);
    }

    .modal-card h3 {
      margin: 0;
      font-family: var(--font-head);
      font-size: 20px;
      font-weight: 500;
      color: var(--teal-deep);
    }

    .modal-close {
      align-self: flex-end;
      background: none;
      border: none;
      color: var(--ink-soft);
      font-size: 13px;
      cursor: pointer;
    }

    /* ----- MAIN APP DASHBOARD (website) ----- */
    .app-dashboard {
      display: flex;
      flex-direction: column;
      gap: 28px;
    }

    /* top stats row */
    .dashboard-top {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
      align-items: stretch;
    }

    .detector-card {
      flex: 2 1 320px;
      background: var(--paper);
      border-radius: var(--radius-lg);
      padding: 28px 26px 30px;
      border: 1.5px solid var(--line);
      box-shadow: var(--shadow-card);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 18px;
    }

    .ring-wrap {
      position: relative;
      width: 180px;
      height: 180px;
    }

    .ring-bg,
    .ring-pulse {
      position: absolute;
      inset: 0;
      border-radius: 50%;
    }

    .ring-bg {
      background: radial-gradient(circle at 50% 40%, #2B3245, var(--teal-deep));
      box-shadow: 0 20px 40px -15px rgba(18, 21, 31, 0.55);
    }

    .ring-pulse {
      border: 3px solid var(--amber);
      opacity: 0;
      transform: scale(1);
    }

    .ring-wrap.armed .ring-pulse {
      animation: pulse 2.4s ease-out infinite;
      opacity: 1;
    }

    .ring-wrap.tripped .ring-bg {
      background: radial-gradient(circle at 50% 40%, #7A1030, var(--brick));
    }

    .ring-wrap.tripped .ring-pulse {
      border-color: var(--brick);
      animation-duration: 1s;
    }

    @keyframes pulse {
      0% {
        transform: scale(0.82);
        opacity: 0.65;
      }
      100% {
        transform: scale(1.14);
        opacity: 0;
      }
    }

    .ring-icon {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .ring-icon svg {
      width: 64px;
      height: 64px;
    }

    .ring-state {
      text-align: center;
    }

    .ring-state .label {
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 0.02em;
      color: var(--teal-deep);
    }

    .ring-state .sub {
      font-size: 12.5px;
      color: var(--ink-soft);
      margin-top: 3px;
    }

    .toggle-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
    }

    .toggle {
      position: relative;
      width: 56px;
      height: 32px;
      background: var(--line);
      border-radius: 999px;
      border: none;
      cursor: pointer;
      transition: 0.2s;
      flex-shrink: 0;
    }

    .toggle.on {
      background: var(--teal);
    }

    .toggle .knob {
      position: absolute;
      top: 3px;
      left: 3px;
      width: 26px;
      height: 26px;
      border-radius: 50%;
      background: #fff;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.25);
      transition: 0.2s;
    }

    .toggle.on .knob {
      left: 27px;
    }

    .toggle-label {
      font-family: var(--font-head);
      font-size: 15px;
      font-weight: 500;
      color: var(--ink);
      letter-spacing: 0.02em;
      text-transform: uppercase;
    }

    /* signals grid */
    .signals-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      width: 100%;
      max-width: 400px;
      margin-top: 4px;
    }

    .signal-chip {
      background: var(--paper);
      border: 1.5px solid var(--line);
      border-radius: var(--radius-md);
      padding: 14px 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      transition: 0.2s;
    }

    .signal-chip.tripped {
      background: var(--brick-soft);
      border-color: var(--brick);
    }

    .signal-chip .s-label {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.03em;
      color: var(--ink-soft);
    }

    .signal-chip.tripped .s-label {
      color: var(--brick);
    }

    .signal-chip .s-value {
      font-size: 14px;
      font-weight: 700;
      color: var(--ink);
    }

    .side-panels {
      flex: 3 1 420px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .how-card {
      background: var(--paper);
      border: 1.5px solid var(--line);
      border-radius: var(--radius-md);
      padding: 20px 22px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      box-shadow: var(--shadow-card);
    }

    .section-title {
      font-family: var(--font-head);
      font-size: 15px;
      font-weight: 500;
      color: var(--teal-deep);
      margin: 0;
      letter-spacing: 0.03em;
      text-transform: uppercase;
    }

    .how-list {
      margin: 0;
      padding-left: 20px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .how-list li {
      font-size: 13px;
      color: var(--ink-soft);
      line-height: 1.55;
    }

    .perm-banner {
      background: var(--amber-soft);
      border: 1.5px solid var(--amber);
      border-radius: var(--radius-md);
      padding: 14px 18px;
      font-size: 13px;
      color: #5A4413;
      line-height: 1.5;
    }

    /* ----- CONTACTS + ALERTS 2-COLUMN LAYOUT (website) ----- */
    .two-column {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 28px;
    }

    @media (max-width: 900px) {
      .two-column {
        grid-template-columns: 1fr;
        gap: 24px;
      }
    }

    .contacts-panel,
    .alerts-panel {
      background: var(--paper);
      border-radius: var(--radius-lg);
      border: 1.5px solid var(--line);
      box-shadow: var(--shadow-card);
      padding: 26px 24px 30px;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .fav-strip {
      display: flex;
      gap: 14px;
      overflow-x: auto;
      padding: 4px 2px 10px;
    }

    .fav-chip {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
      width: 68px;
      cursor: pointer;
    }

    .fav-chip .avatar {
      width: 54px;
      height: 54px;
      border-radius: 16px;
      background: var(--teal);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 18px;
      overflow: hidden;
      flex-shrink: 0;
    }

    .fav-chip .avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .fav-chip .fname {
      font-size: 11px;
      font-weight: 600;
      color: var(--ink);
      text-align: center;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      width: 100%;
    }

    .search-bar {
      display: flex;
      align-items: center;
      gap: 10px;
      background: var(--paper);
      border: 1.5px solid var(--line);
      border-radius: 999px;
      padding: 11px 18px;
    }

    .search-bar svg {
      width: 18px;
      height: 18px;
      color: var(--ink-soft);
      flex-shrink: 0;
    }

    .search-bar input {
      border: none;
      outline: none;
      background: transparent;
      flex: 1;
      font-size: 15px;
      color: var(--ink);
      font-family: inherit;
    }

    #searchResults {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 4px;
    }

    .user-row {
      display: flex;
      align-items: center;
      gap: 12px;
      background: var(--paper);
      border: 1.5px solid var(--line);
      border-radius: var(--radius-md);
      padding: 12px 14px;
      transition: 0.1s;
    }

    .user-row .avatar {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      background: var(--teal);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 16px;
      overflow: hidden;
      flex-shrink: 0;
    }

    .user-row .meta {
      flex: 1;
      min-width: 0;
    }

    .user-row .u-name {
      font-family: var(--font-head);
      font-weight: 500;
      font-size: 15px;
      color: var(--ink);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .user-row .u-username {
      font-size: 12px;
      color: var(--ink-soft);
    }

    .row-actions {
      display: flex;
      gap: 8px;
      flex-shrink: 0;
    }

    .row-actions button {
      padding: 8px 12px;
      font-size: 12px;
      border-radius: 8px;
    }

    .tabs {
      display: flex;
      gap: 10px;
    }

    .tab-btn {
      flex: 1;
      padding: 10px 0;
      border-radius: 999px;
      border: 1.5px solid var(--line);
      background: var(--paper);
      font-family: var(--font-head);
      font-size: 13px;
      font-weight: 500;
      letter-spacing: 0.03em;
      text-transform: uppercase;
      color: var(--ink-soft);
      cursor: pointer;
      transition: 0.15s;
    }

    .tab-btn.active {
      background: var(--teal);
      border-color: var(--teal);
      color: #fff;
    }

    #alertsList {
      display: flex;
      flex-direction: column;
      gap: 12px;
      max-height: 520px;
      overflow-y: auto;
      padding-right: 4px;
    }

    .alert-card {
      background: var(--paper);
      border: 1.5px solid var(--line);
      border-left: 5px solid var(--brick);
      border-radius: var(--radius-md);
      padding: 16px 18px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      box-shadow: 0 4px 12px -6px rgba(0, 0, 0, 0.06);
    }

    .alert-card .a-top {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 10px;
    }

    .alert-card .a-name {
      font-family: var(--font-head);
      font-weight: 500;
      font-size: 14px;
      color: var(--ink);
    }

    .alert-card .a-time {
      font-size: 11px;
      color: var(--ink-soft);
      flex-shrink: 0;
    }

    .alert-card .a-msg {
      font-size: 13px;
      color: var(--ink-soft);
      line-height: 1.5;
    }

    .alert-card .a-tag {
      font-size: 10px;
      font-weight: 700;
      color: var(--brick);
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .alert-card .a-location {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      font-weight: 600;
      color: var(--teal);
      text-decoration: none;
      margin-top: 4px;
    }

    .alert-card .a-location svg {
      width: 15px;
      height: 15px;
      flex-shrink: 0;
    }

    .alert-card .a-location-missing {
      color: var(--ink-soft);
      font-weight: 500;
    }

    .call-links {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 6px;
    }

    .call-chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: var(--teal-soft);
      color: var(--teal-deep);
      padding: 7px 13px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 700;
      text-decoration: none;
      transition: 0.1s;
    }

    .call-chip svg {
      width: 14px;
      height: 14px;
      flex-shrink: 0;
    }

    .call-chip.danger {
      background: var(--brick-soft);
      color: var(--brick);
    }

    /* ----- PROFILE SECTION (website) ----- */
    .profile-section {
      background: var(--paper);
      border-radius: var(--radius-lg);
      border: 1.5px solid var(--line);
      box-shadow: var(--shadow-card);
      padding: 32px 36px 36px;
      display: flex;
      flex-direction: column;
      gap: 26px;
    }

    .profile-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 22px 28px;
    }

    @media (max-width: 700px) {
      .profile-grid {
        grid-template-columns: 1fr;
        gap: 18px;
      }
    }

    .avatar-upload {
      display: flex;
      align-items: center;
      gap: 20px;
      padding-bottom: 6px;
    }

    .avatar-upload .avatar {
      width: 80px;
      height: 80px;
      border-radius: 20px;
      background: var(--teal);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 28px;
      overflow: hidden;
      flex-shrink: 0;
    }

    .avatar-upload .avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* ----- COUNTDOWN OVERLAY (fixed full screen) ----- */
    #countdownOverlay {
      position: fixed;
      inset: 0;
      background: rgba(15, 17, 14, 0.92);
      backdrop-filter: blur(4px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 28px;
      padding: 32px 26px;
      z-index: 100;
      text-align: center;
    }

    .cd-title {
      font-family: var(--font-head);
      color: #fff;
      font-size: 24px;
      font-weight: 500;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }

    .cd-num {
      width: 160px;
      height: 160px;
      border-radius: 50%;
      border: 6px solid var(--brick);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 64px;
      font-weight: 800;
      color: #fff;
      background: rgba(245, 50, 92, 0.18);
    }

    .cd-sub {
      color: #D8D2C4;
      font-size: 15px;
      line-height: 1.7;
      max-width: 400px;
    }

    #cdCallLinks {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: center;
    }

    /* ----- BOTTOM SHEET (fixed) ----- */
    .sheet-overlay {
      position: fixed;
      inset: 0;
      background: rgba(18, 21, 31, 0.55);
      backdrop-filter: blur(3px);
      display: flex;
      align-items: flex-end;
      justify-content: center;
      z-index: 80;
    }

    .sheet {
      background: var(--paper);
      width: 100%;
      max-width: 520px;
      border-radius: 28px 28px 0 0;
      padding: 28px 30px 34px;
      display: flex;
      flex-direction: column;
      gap: 18px;
      box-shadow: 0 -20px 40px -10px rgba(0, 0, 0, 0.2);
    }

    .sheet-handle {
      width: 48px;
      height: 5px;
      background: var(--line);
      border-radius: 99px;
      margin: 0 auto 6px;
    }

    .sheet-user {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .sheet-user .avatar {
      width: 56px;
      height: 56px;
      border-radius: 16px;
      background: var(--teal);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 20px;
      overflow: hidden;
      flex-shrink: 0;
    }

    .sheet-user .avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* ----- TOASTS (fixed) ----- */
    .toast-container {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      z-index: 200;
      pointer-events: none;
      width: 100%;
      max-width: 480px;
      padding: 0 20px;
    }

    .toast {
      background: var(--teal-deep);
      color: #fff;
      font-size: 14px;
      font-weight: 600;
      padding: 13px 22px;
      border-radius: 999px;
      box-shadow: 0 10px 20px -8px rgba(0, 0, 0, 0.4);
      max-width: 100%;
      animation: toastIn 0.2s ease-out;
      text-align: center;
    }

    .toast.danger {
      background: var(--brick);
    }

    @keyframes toastIn {
      from {
        opacity: 0;
        transform: translateY(10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* ----- UTILITY ----- */
    .hidden {
      display: none !important;
    }

    .empty-state {
      text-align: center;
      padding: 30px 10px;
      color: var(--ink-soft);
      font-size: 14px;
      line-height: 1.6;
    }

    /* custom scrollbars */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }

    ::-webkit-scrollbar-thumb {
      background: #c4c7ce;
      border-radius: 99px;
    }

    ::-webkit-scrollbar-track {
      background: transparent;
    }

    /* small adjustments for mobile website */
    @media (max-width: 600px) {
      .website-wrapper {
        padding: 16px 16px 32px;
      }

      .auth-card {
        padding: 28px 22px 32px;
      }

      .dashboard-top {
        flex-direction: column;
      }

      .field-row {
        flex-direction: column;
        gap: 12px;
      }

      .profile-section {
        padding: 24px 20px 28px;
      }

      .contacts-panel,
      .alerts-panel {
        padding: 20px 18px 24px;
      }

      .signals-grid {
        grid-template-columns: repeat(3, 1fr);
      }

      .cd-num {
        width: 120px;
        height: 120px;
        font-size: 48px;
      }

      .cd-title {
        font-size: 19px;
      }
    }
  </style>
</head>
